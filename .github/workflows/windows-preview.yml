name: Windows preview artifact
on:
  workflow_dispatch:
  push:
    branches: ['preview/windows-*']
permissions:
  contents: read
concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate preview version and guide
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = [xml](Get-Content src/ChinhTa.Desktop/ChinhTa.Desktop.csproj -Raw)
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^0\.[0-9]+\.[0-9]+$') { throw 'Prepare a numbered preview version first' }
          if (-not (Test-Path "docs/PREVIEW-$version.md")) { throw 'Prepare the current-version Word validation guide first' }
          New-Item artifacts -ItemType Directory -Force | Out-Null
          "PREVIEW_VERSION=$version" >> $env:GITHUB_ENV
          "PREVIEW_SHORT_SHA=$($env:GITHUB_SHA.Substring(0,8))" >> $env:GITHUB_ENV
      - name: Core and OpenXML regression checks
        shell: pwsh
        run: |
          dotnet run --project tests/ChinhTa.Checks -c Release | Tee-Object -FilePath artifacts/core-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: WPF regression checks and application build
        shell: pwsh
        run: |
          dotnet run --project tests/ChinhTa.DesktopChecks -c Release | Tee-Object -FilePath artifacts/wpf-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record actual preview checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $core = [regex]::Matches((Get-Content artifacts/core-checks.log -Raw), '(?m)^(\d+) checks passed\.\s*$')
          $wpf = [regex]::Matches((Get-Content artifacts/wpf-checks.log -Raw), '(?m)^(\d+) WPF checks passed\.\s*$')
          if ($core.Count -ne 1 -or $wpf.Count -ne 1 -or [int]$core[0].Groups[1].Value -le 0 -or [int]$wpf[0].Groups[1].Value -le 0) { throw 'Missing unique successful check totals' }
          @{
            Version = $env:PREVIEW_VERSION
            CoreChecks = [int]$core[0].Groups[1].Value
            WpfChecks = [int]$wpf[0].Groups[1].Value
            Commit = $env:GITHUB_SHA
            RunUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json | Set-Content artifacts/build-checks.json -Encoding utf8
          "## Windows preview $env:PREVIEW_VERSION`n`nCommit: $env:GITHUB_SHA`n`nCore/OpenXML: $($core[0].Groups[1].Value) passed`n`nWPF: $($wpf[0].Groups[1].Value) passed`n`nMicrosoft Word: **NOT_RUN**. Exactly/AtLeast automatic repair remains unchanged." >> $env:GITHUB_STEP_SUMMARY
      - name: Publish self-contained Windows x64 preview
        shell: pwsh
        run: |
          dotnet publish src/ChinhTa.Desktop -c Release -r win-x64 --self-contained true -o artifacts/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item samples artifacts/win-x64/samples -Recurse
          Copy-Item artifacts/build-checks.json artifacts/win-x64/
          Copy-Item docs/FORMAT-BATCH-*.md artifacts/win-x64/
          Copy-Item docs/REMAINING-WORK.md,docs/USER-PREFERENCES.md,docs/RELEASE-CADENCE.md artifacts/win-x64/
          Copy-Item docs/KIEM-TRA-WORD.cmd artifacts/win-x64/
          dotnet run --project scripts/PreviewMetadata -c Release -- prepare artifacts/win-x64 $env:PREVIEW_VERSION "docs/PREVIEW-$env:PREVIEW_VERSION.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged offline spelling data without user import or network
        shell: pwsh
        run: |
          dotnet run --project tests/ChinhTa.DesktopChecks -c Release -- --verify-spelling-package artifacts/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preview metadata tamper regression checks
        shell: pwsh
        run: |
          python -X warn_default_encoding -W error::EncodingWarning scripts/PreviewMetadata/checks.py 2>&1 | Tee-Object -FilePath artifacts/preview-metadata-checks.log
          $checkExit = $LASTEXITCODE
          if ($checkExit -ne 0) {
            "`nSynthetic metadata checks failed (exit $checkExit). Last synthetic-fixture diagnostics:`n``````text" >> $env:GITHUB_STEP_SUMMARY
            Get-Content artifacts/preview-metadata-checks.log -Tail 40 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
            exit $checkExit
          }
          $log = Get-Content artifacts/preview-metadata-checks.log -Raw
          $match = [regex]::Match($log, '(?m)^(\d+) preview-metadata checks passed')
          if (-not $match.Success -or [int]$match.Groups[1].Value -le 0) { throw 'Missing successful metadata regression total' }
          "`nSynthetic metadata regression checks: $($match.Groups[1].Value) passed (separate from Core/WPF totals)." >> $env:GITHUB_STEP_SUMMARY
          if ($log.Contains('SKIP symlink creation:')) { "`nSymlink-creation fixture skipped because this runner does not grant that capability." >> $env:GITHUB_STEP_SUMMARY }
      - name: Packaged executable rejects invalid Word-check selection without opening Word
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path artifacts/win-x64/ChinhTa.Desktop.exe).Path
          $directory = (Resolve-Path artifacts/win-x64).Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--word-check', 'unknown-suite') -WorkingDirectory $directory -PassThru
          if (-not $process.WaitForExit(20000)) {
            try { $process.Kill() } catch { }
            throw 'The packaged executable hung instead of rejecting an invalid check selection'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 2) { throw "Expected invalid-selection exit code 2, got $($process.ExitCode)" }
          "`nPackaged executable invalid-selection smoke: passed (exit 2, no Word check requested)." >> $env:GITHUB_STEP_SUMMARY
      - name: Verify packaged report metadata
        shell: pwsh
        run: |
          dotnet run --project tests/ChinhTa.DesktopChecks -c Release -- --verify-report-package artifacts/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "artifacts/ChinhTaViet-$env:PREVIEW_VERSION-tien-do.txt" artifacts/win-x64/
          dotnet run --project scripts/PreviewMetadata -c Release -- manifest artifacts/win-x64 $env:PREVIEW_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive and independently verify extracted preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item artifacts/package -ItemType Directory -Force | Out-Null
          $name = "ChinhTaViet-$env:PREVIEW_VERSION-preview-$env:PREVIEW_SHORT_SHA-win-x64.zip"
          Compress-Archive artifacts/win-x64/* "artifacts/package/$name"
          Expand-Archive "artifacts/package/$name" artifacts/preview-extracted
          dotnet run --project scripts/PreviewMetadata -c Release -- verify artifacts/preview-extracted $env:PREVIEW_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/ChinhTa.DesktopChecks -c Release -- --verify-report-package artifacts/preview-extracted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/ChinhTa.DesktopChecks -c Release -- --verify-spelling-package artifacts/preview-extracted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash "artifacts/package/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content artifacts/package/SHA256.txt -Encoding ascii
          Copy-Item artifacts/build-checks.json artifacts/package/
          "`nPackage metadata: passed before and after ZIP extraction.`n`nZIP: $name`n`nSHA256: $hash`n`nThis workflow uploads a preview artifact only; it creates no release or tag." >> $env:GITHUB_STEP_SUMMARY
      - name: Reject tampering in a private copy of the extracted preview
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/PreviewMetadata/VerifyTamper.ps1 -PackageFolder artifacts/preview-extracted -Version $env:PREVIEW_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ChinhTaViet-${{ env.PREVIEW_VERSION }}-preview-${{ env.PREVIEW_SHORT_SHA }}
          path: artifacts/package/*
          if-no-files-found: error
          retention-days: 30
      - name: Record preview artifact identity
        shell: pwsh
        env:
          PREVIEW_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          PREVIEW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          PREVIEW_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          "`nArtifact ID: $env:PREVIEW_ARTIFACT_ID`n`nArtifact SHA256: $env:PREVIEW_ARTIFACT_DIGEST`n`nDownload: $env:PREVIEW_ARTIFACT_URL" >> $env:GITHUB_STEP_SUMMARY
