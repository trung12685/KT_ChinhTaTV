name: Word Add-in preview
on:
  push:
    branches: ['preview/word-addin-*', 'diagnostic/word-addin-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Word ${{ matrix.architecture }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Core and OpenXML checks
        if: ${{ !startsWith(github.ref, 'refs/heads/diagnostic/') }}
        shell: pwsh
        run: |
          New-Item artifacts -ItemType Directory -Force | Out-Null
          dotnet run --project tests/ChinhTa.Checks -c Release | Tee-Object artifacts/core.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing desktop regression checks
        if: ${{ !startsWith(github.ref, 'refs/heads/diagnostic/') }}
        shell: pwsh
        run: |
          dotnet run --project tests/ChinhTa.DesktopChecks -c Release | Tee-Object artifacts/desktop.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Worker protocol and dictionary checks
        if: ${{ !startsWith(github.ref, 'refs/heads/diagnostic/') }}
        shell: pwsh
        run: |
          dotnet run --project tests/ChinhTa.WordWorkerChecks -c Release | Tee-Object artifacts/worker.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Framework COM host and native control checks without Word
        shell: pwsh
        run: |
          $testOutput=Join-Path $PWD 'artifacts/host-checks'
          New-Item artifacts -ItemType Directory -Force | Out-Null
          dotnet build tests/ChinhTa.WordAddinChecks -c Release -p:PlatformTarget=${{ matrix.architecture }} -p:OutputPath="$testOutput/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$testOutput/ChinhTa.WordAddinChecks.exe" '${{ matrix.architecture }}' | Tee-Object artifacts/host.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Architecture and Windows PowerShell checks
        shell: pwsh
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -File tests/ChinhTa.WordRegistrationChecks/ArchitectureChecks.ps1 -RepositoryRoot "$PWD" | Tee-Object artifacts/architecture.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify actual registration on a disposable runner
        shell: pwsh
        run: |
          & scripts/WordAddin/package.ps1 -Output artifacts/word-addin -Architecture '${{ matrix.architecture }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probeOutput=Join-Path $PWD 'artifacts/registration-probe'
          dotnet build tests/ChinhTa.WordRegistrationChecks -c Release -p:PlatformTarget=${{ matrix.architecture }} -p:OutputPath="$probeOutput/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive artifacts/word-addin/* artifacts/registration-input.zip
          Expand-Archive artifacts/registration-input.zip artifacts/registration-input
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -File tests/ChinhTa.WordRegistrationChecks/InstallerChecks.ps1 -PackagePath artifacts/registration-input -Architecture '${{ matrix.architecture }}' -ProbeExe "$probeOutput/ChinhTa.WordRegistrationChecks.exe" | Tee-Object artifacts/install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ github.ref }}'.StartsWith('refs/heads/diagnostic/')) { 'COM registration diagnostic only; no distributable artifact.' >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          $core=[regex]::Match((Get-Content artifacts/core.log -Raw),'(?m)^(\d+) checks passed\.').Groups[1].Value
          $desktop=[regex]::Match((Get-Content artifacts/desktop.log -Raw),'(?m)^(\d+) WPF checks passed\.').Groups[1].Value
          $worker=[regex]::Match((Get-Content artifacts/worker.log -Raw),'(?m)^(\d+) worker checks passed\.').Groups[1].Value
          $wordHostChecks=[regex]::Match((Get-Content artifacts/host.log -Raw),'(?m)^(\d+) Word host checks passed\.').Groups[1].Value
          $architectureChecks=[regex]::Match((Get-Content artifacts/architecture.log -Raw),'(?m)^(\d+) architecture checks passed\.').Groups[1].Value
          $registrationChecks=[regex]::Match((Get-Content artifacts/install.log -Raw),'(?m)^(\d+) registration checks passed').Groups[1].Value
          $installerChecks=[regex]::Match((Get-Content artifacts/install.log -Raw),'(?m)^(\d+) installer checks passed\.').Groups[1].Value
          if (!$core -or !$desktop -or !$worker -or !$wordHostChecks -or !$architectureChecks -or !$registrationChecks -or !$installerChecks) { throw 'Missing successful check totals' }
          @{Version='0.1.90';Architecture='${{ matrix.architecture }}';Commit=$env:GITHUB_SHA;Core=[int]$core;Desktop=[int]$desktop;Worker=[int]$worker;Host=[int]$wordHostChecks;ArchitectureChecks=[int]$architectureChecks;RegistrationChecks=[int]$registrationChecks;InstallerChecks=[int]$installerChecks;Installer='CI_FIXTURE_ROUNDTRIP_PASS';Word='NOT_RUN'} | ConvertTo-Json | Set-Content artifacts/build-checks.json -Encoding UTF8
          Copy-Item artifacts/build-checks.json artifacts/word-addin/
          New-Item artifacts/package -ItemType Directory -Force | Out-Null
          $name="ChinhTaViet-WordAddin-0.1.90-$($env:GITHUB_SHA.Substring(0,8))-win-${{ matrix.architecture }}.zip"
          Compress-Archive artifacts/word-addin/* "artifacts/package/$name"
          Expand-Archive "artifacts/package/$name" artifacts/extracted
          & artifacts/extracted/Install-WordAddin.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash "artifacts/package/$name" -Algorithm SHA256).Hash | Set-Content artifacts/package/SHA256.txt
          Copy-Item artifacts/build-checks.json artifacts/package/
          "Word Add-in 0.1.90 win-${{ matrix.architecture }}, commit $env:GITHUB_SHA. Core $core, desktop $desktop, worker $worker, host $wordHostChecks, architecture $architectureChecks, registration $registrationChecks, installer $installerChecks. Installed/activated/uninstalled in a disposable CI fixture, not a user PC. Word runtime: NOT_RUN." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/heads/diagnostic/') }}
        with:
          name: ChinhTaViet-WordAddin-0.1.90-win-${{ matrix.architecture }}-${{ github.sha }}
          path: artifacts/package/*
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WordAddin-check-logs-${{ matrix.architecture }}-${{ github.sha }}
          path: artifacts/*.log
