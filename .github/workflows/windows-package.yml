name: Windows package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['release/windows-*']
permissions:
  contents: write
concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate release checkpoint
        id: release
        shell: pwsh
        run: |
          $project = [xml](Get-Content src/ChinhTa.Desktop/ChinhTa.Desktop.csproj -Raw)
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^0\.[0-9]+\.[0-9]+$') { throw 'Prepare a numbered release version first' }
          $notes = "docs/CHANGES-$version.md"
          $support = "docs/SUPPORTED-FIXES-$version.md"
          if (-not (Test-Path $notes) -or -not (Test-Path $support)) { throw 'Prepare release notes and supported-fix checklist after the development batch' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag does not match the project version' }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'branch' -and $env:GITHUB_REF_NAME -cne "release/windows-$version") { throw 'Release branch does not match the prepared version' }
          $remoteTag = git ls-remote --tags origin "refs/tags/v$version"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the remote release tag' }
          if ($env:GITHUB_REF_TYPE -ne 'tag' -and $remoteTag) { throw 'Release tag already exists; use a new version, never overwrite' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_NOTES=$notes" >> $env:GITHUB_ENV
      - name: Regression checks
        shell: pwsh
        run: |
          New-Item artifacts -ItemType Directory -Force | Out-Null
          dotnet run --project tests/ChinhTa.Checks -c Release | Tee-Object -FilePath artifacts/core-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: WPF coordinate and report checks
        shell: pwsh
        run: |
          dotnet run --project tests/ChinhTa.DesktopChecks -c Release | Tee-Object -FilePath artifacts/wpf-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record actual build checks
        shell: pwsh
        run: |
          $coreMatch = [regex]::Match((Get-Content artifacts/core-checks.log -Raw), '(?m)^(\d+) checks passed\.\s*$')
          $wpfMatch = [regex]::Match((Get-Content artifacts/wpf-checks.log -Raw), '(?m)^(\d+) WPF checks passed\.\s*$')
          if (-not $coreMatch.Success -or -not $wpfMatch.Success) { throw 'Missing successful check totals' }
          $project = [xml](Get-Content src/ChinhTa.Desktop/ChinhTa.Desktop.csproj -Raw)
          @{
            Version = [string]$project.Project.PropertyGroup.Version
            CoreChecks = [int]$coreMatch.Groups[1].Value
            WpfChecks = [int]$wpfMatch.Groups[1].Value
            Commit = $env:GITHUB_SHA
            RunUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json | Set-Content artifacts/build-checks.json -Encoding utf8
      - name: Publish Windows x64
        run: dotnet publish src/ChinhTa.Desktop -c Release -r win-x64 --self-contained true -o artifacts/win-x64
      - name: Include samples and validation notes
        shell: pwsh
        run: |
          Copy-Item samples artifacts/win-x64/samples -Recurse -Force
          Copy-Item $env:RELEASE_NOTES artifacts/win-x64/
          Copy-Item docs/BASELINE-0.1.67.json artifacts/win-x64/
          Copy-Item docs/CHANGES-0.1.65.md artifacts/win-x64/
          Copy-Item docs/RELEASE-CADENCE.md artifacts/win-x64/
          Copy-Item docs/BATCH-AFTER-0.1.59.md artifacts/win-x64/
          Copy-Item docs/BATCH-AFTER-0.1.60.md artifacts/win-x64/
          Copy-Item docs/BATCH-AFTER-0.1.61.md artifacts/win-x64/
          Copy-Item docs/BATCH-AFTER-0.1.62.md artifacts/win-x64/
          Copy-Item docs/BATCH-AFTER-0.1.63.md artifacts/win-x64/
          Copy-Item docs/BATCH-AFTER-0.1.64.md artifacts/win-x64/
          Copy-Item docs/QUOTED-PUNCTUATION.md artifacts/win-x64/
          Copy-Item docs/QUOTE-AFTER-SPACING.md artifacts/win-x64/
          Copy-Item docs/DELIMITER-CLUSTER.md artifacts/win-x64/
          Copy-Item docs/CHANGES-0.1.64.md artifacts/win-x64/
          Copy-Item docs/BODY-EMPHASIS.md artifacts/win-x64/
          Copy-Item docs/BODY-EMPHASIS-LAYOUT.md artifacts/win-x64/
          Copy-Item docs/BODY-RULE-SCAN.md artifacts/win-x64/
          Copy-Item docs/QUOTE-SPACING.md artifacts/win-x64/
          Copy-Item docs/CHANGES-0.1.63.md artifacts/win-x64/
          Copy-Item docs/BODY-FORMAT.md artifacts/win-x64/
          Copy-Item docs/BODY-PARAGRAPH.md artifacts/win-x64/
          Copy-Item docs/BODY-SPACING.md artifacts/win-x64/
          Copy-Item docs/BODY-OPENING.md artifacts/win-x64/
          Copy-Item docs/CHANGES-0.1.62.md artifacts/win-x64/
          Copy-Item docs/SELECTIVE-SIZE-REPAIR.md artifacts/win-x64/
          Copy-Item docs/CASE-PRESERVATION.md artifacts/win-x64/
          Copy-Item docs/HIERARCHICAL-OUTLINE.md artifacts/win-x64/
          Copy-Item docs/CHANGES-0.1.61.md artifacts/win-x64/
          Copy-Item docs/FORMAT-ASSESSMENT.md artifacts/win-x64/
          Copy-Item docs/REPAIR-DEPENDENCIES.md artifacts/win-x64/
          Copy-Item docs/CHANGES-0.1.60.md artifacts/win-x64/
          Copy-Item docs/CHANGES-0.1.59.md artifacts/win-x64/
          Copy-Item docs/CHANGES-0.1.58.md artifacts/win-x64/
          Copy-Item docs/DOCUMENT-TYPES.md artifacts/win-x64/
          Copy-Item docs/CHANGES-0.1.57.md artifacts/win-x64/
          Copy-Item docs/CHANGES-0.1.56.md artifacts/win-x64/
          Copy-Item docs/CHANGES-0.1.55.md artifacts/win-x64/
          Copy-Item docs/CHANGES-0.1.54.md artifacts/win-x64/
          Copy-Item docs/REPORT-EXPORT.md artifacts/win-x64/
          Copy-Item docs/ISSUE-LIST.md artifacts/win-x64/
          Copy-Item docs/OUTLINE-CONTEXT.md artifacts/win-x64/
          Copy-Item docs/MULTI-GROUP-REPAIR.md artifacts/win-x64/
          Copy-Item "docs/SUPPORTED-FIXES-$env:RELEASE_VERSION.md" artifacts/win-x64/
          Copy-Item artifacts/build-checks.json artifacts/win-x64/
      - name: Verify packaged report metadata
        run: dotnet run --project tests/ChinhTa.DesktopChecks -c Release -- --verify-report-package artifacts/win-x64
      - name: Archive and hash
        shell: pwsh
        run: |
          Copy-Item artifacts/ChinhTaViet-${{ env.RELEASE_VERSION }}-tien-do.txt artifacts/win-x64/
          Compress-Archive artifacts/win-x64/* artifacts/ChinhTaViet-${{ env.RELEASE_VERSION }}-win-x64.zip
          $zipName = 'ChinhTaViet-${{ env.RELEASE_VERSION }}-win-x64.zip'
          $zipHash = (Get-FileHash "artifacts/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $zipName" | Set-Content artifacts/SHA256.txt -Encoding ascii
          Write-Output "Windows ZIP SHA256: $zipHash"
      - uses: actions/upload-artifact@v4
        with:
          name: ChinhTaViet-${{ env.RELEASE_VERSION }}-win-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256.txt
            artifacts/build-checks.json
            artifacts/ChinhTaViet-${{ env.RELEASE_VERSION }}-tien-do.txt
            artifacts/issue-list-preview.png
            artifacts/issue-tooltip-preview.png
            artifacts/repair-progress-preview.png
            artifacts/document-types-preview.png
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $checks = Get-Content artifacts/build-checks.json -Raw | ConvertFrom-Json
          $notes = (Get-Content $env:RELEASE_NOTES -Raw) + "`n`nKiểm thử tự động thực tế: $($checks.CoreChecks) Core/OpenXML + $($checks.WpfChecks) WPF; kiểm metadata gói đạt. Commit: $($checks.Commit). CI: $($checks.RunUrl). Chưa xác nhận bài Word thực tế trên Office 2021."
          $notes | Set-Content artifacts/release-notes.md -Encoding utf8
          gh release create v${{ env.RELEASE_VERSION }} artifacts/ChinhTaViet-${{ env.RELEASE_VERSION }}-win-x64.zip artifacts/SHA256.txt artifacts/build-checks.json artifacts/ChinhTaViet-${{ env.RELEASE_VERSION }}-tien-do.txt artifacts/issue-list-preview.png artifacts/issue-tooltip-preview.png artifacts/repair-progress-preview.png artifacts/document-types-preview.png --target $env:GITHUB_SHA --prerelease --title "$env:RELEASE_VERSION — Bản thử tích lũy" --notes-file artifacts/release-notes.md
